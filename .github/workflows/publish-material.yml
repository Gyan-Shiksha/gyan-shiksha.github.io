name: Publish verified study material
run-name: Add approved educational file
on:
  workflow_dispatch:
    inputs:
      title:
        description: "ફાઇલનું શીર્ષક - ઉદાહરણ: ધોરણ 8 ગુજરાતી નોટ્સ"
        required: true
        type: string
      standard:
        description: "કોઈપણ ધોરણ/શ્રેણી - 1-12, College, Competitive, Teacher, General"
        required: true
        type: string
      subject:
        description: "વિષય - ગુજરાતી, ગણિત, ઇતિહાસ, કલા, વગેરે"
        required: true
        type: string
      category:
        description: "સામગ્રીનો પ્રકાર"
        required: true
        type: choice
        options:
          - PDF
          - Image
          - Notes
          - Question Paper
          - Worksheet
          - Textbook
          - Presentation
          - Video
          - Audio
          - Other
      description:
        description: "ફાઇલમાં શું છે? વિદ્યાર્થીઓને ઉપયોગી 20+ અક્ષરની માહિતી"
        required: true
        type: string
      board:
        description: "બોર્ડ (વૈકલ્પિક) - GSEB, GSBSTB, HSC, SSC, GSET, Other"
        required: false
        type: string
      year:
        description: "પુસ્તકની આવૃત્તિનું વર્ષ (વૈકલ્પિક), જેમ કે 2026; અપલોડની તારીખ નહીં"
        required: false
        type: string
      url:
        description: "માત્ર વ્યક્તિગત Google Drive / Google Docs / MEGA ફાઇલની Viewer link"
        required: true
        type: string
      rights_confirmed:
        description: "આ ફાઇલ શેર કરવાની મંજૂરી છે; Incognitoમાં માત્ર આ જ ફાઇલ ખૂલે છે"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: verified-material-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Gyan-Shiksha/gyan-shiksha.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout official repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate owner input and add single file
        env:
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_STANDARD: ${{ inputs.standard }}
          INPUT_SUBJECT: ${{ inputs.subject }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
          INPUT_BOARD: ${{ inputs.board }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
        run: python3 tools/add_material.py
      - name: Enforce content approval and folder privacy
        run: python3 tools/check_public_feeds.py
      - name: Commit approved material to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/materials.json
          git diff --cached --check
          git commit -m "Materials: publish one owner-approved educational file"
          git push origin HEAD:main
