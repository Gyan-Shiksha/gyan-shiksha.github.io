name: Gyan Shiksha Website QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test material publishing, file permissions and URL restrictions
        run: |
          python3 -m py_compile tools/add_material.py tools/check_public_feeds.py tools/test_material_publication.py
          python3 tools/test_material_publication.py
          python3 tools/test_bulk_material_import.py
          python3 -m py_compile tools/import_materials_csv.py tools/test_bulk_material_import.py
          node --check assets/js/material-library-v317.js
          node tools/test_material_pagination.js
          node tools/test_material_real_catalogue.js
      - name: Test private Google Sheet editorial import and validate subject lessons
        run: |
          python3 -m py_compile tools/import_editorial_csv.py tools/test_editorial_import.py tools/check_posts.py
          python3 tools/test_editorial_import.py
          python3 tools/check_posts.py
      - name: Validate organic WhatsApp campaign and student content links
        run: python3 tools/test_organic_marketing.py
      - name: Informational AdSense preflight (copyright evidence is human-review only)
        run: |
          python3 -m py_compile tools/audit_adsense_readiness.py
          python3 tools/audit_adsense_readiness.py
      - name: Check approved public feeds and private-folder safety
        run: python3 tools/check_public_feeds.py
      - name: Build sitemap
        run: python3 tools/build_sitemap.py
      - name: Run website validation
        run: python3 tools/validate_site.py
      - name: Verify generated sitemap is committed
        run: git diff --exit-code -- sitemap.xml
      - name: Check Markdown blog layout
        run: |
          test -f _config.yml
          test -f _layouts/post.html
          test ! -e .nojekyll
      - name: Render with the GitHub Pages Jekyll builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check rendered blog listing and sitemap
        run: |
          test -f _site/blog.html
          test -f _site/sitemap.xml
          grep -q 'https://gyanshiksha.in/' _site/sitemap.xml
          if grep -F -q '{% for post in site.posts %}' _site/blog.html; then exit 1; fi
          if grep -F -q '{{ site.url }}' _site/sitemap.xml; then exit 1; fi
      - name: Validate fully rendered pages and shared templates
        env:
          GYAN_SITE_ROOT: _site
        run: python3 tools/validate_site.py
      - name: Confirm Jekyll includes were processed on live HTML
        run: |
          if grep -F -q '{% include site-header.html %}' _site/index.html; then exit 1; fi
          if grep -F -q '{% include site-footer.html %}' _site/blog.html; then exit 1; fi
          grep -F -q 'class="site-header"' _site/index.html
          grep -F -q 'class="site-footer"' _site/blog.html
      - name: Check all rendered internal links and functional HTML hooks
        env:
          GYAN_SITE_ROOT: _site
        run: python3 tools/check_functional_site.py
